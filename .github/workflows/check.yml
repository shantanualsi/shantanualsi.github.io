name: Check
on:
  pull_request:
  workflow_dispatch:
defaults:
  run:
    shell: bash
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=github-releases depName=gohugoio/hugo extractVersion=^v(?<version>.*)$
      HUGO_VERSION: 0.166.0
      # renovate: datasource=node-version depName=node versioning=node
      NODE_VERSION: 24.19.0
      TZ: Asia/Kolkata
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Hugo
        run: |
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
      - name: Build the site
        run: hugo --gc --minify --baseURL "https://example.com/"
      - name: Homepage smoke test
        run: bin/smoke.sh
      - name: Search logic tests
        run: node tests/home-search.test.js assets/js/home-search.js
